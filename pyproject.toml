[project]
name = "cfnet-change-detection-pipeline"
version = "0.1.0"
description = "DIMER pipeline for CFNet bi-temporal remote-sensing change detection (wifibk/CFNet, the LEVIR-CD checkpoint): building-change maps for co-registered RGB pairs, held-out evaluation against an all-unchanged baseline, and bounded change-decoder fine-tuning with a portable adapter"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Kurt Valcorza" }]
dependencies = [
  # The upstream checkpoint is a torch pickle of the state dict; this package converts it once into safetensors
  # (docs/WEIGHTS.md) and rebuilds the network from its own vendored module (src/.../modeling.py), which takes the
  # EfficientNet-B5 stages from torchvision with weights=None. Pillow reads and writes the image pairs.
  "torch==2.14.0",
  "torchvision==0.29.0",
  "numpy==2.5.3",
  "pillow==11.3.0",
  "safetensors==0.8.0",
  "huggingface-hub==1.32.0",
]
[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.16.6"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/cfnet_change_detection_pipeline"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 130
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["tutorials"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
